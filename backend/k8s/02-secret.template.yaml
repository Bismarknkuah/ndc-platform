# DO NOT commit real values here. This is a template for `kubectl create -f`
# after substituting placeholders, or for a Sealed Secrets / External Secrets
# Operator source manifest. In production, prefer syncing from a secret
# manager (AWS Secrets Manager, GCP Secret Manager, Vault, etc.) rather than
# applying raw Secret manifests.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ndc-platform
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net"
  REDIS_URL: "redis://redis:6379/0"
  BOOTSTRAP_ADMIN_EMAIL: "admin@ndc.example"
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_ME"
